name = "iprn-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
APP_NAME = "IPRN Online"
APP_VERSION = "1.0.0"
ADMIN_TOKEN = "dev-admin-token-change-me"
VITE_API_URL = "https://iprn-worker.example.dev"

[[d1_databases]]
binding = "DB"
database_name = "IPRN_PRODUCTION"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "0000000000004b8a8b8a8b8a8b8a8b8a"
preview_id = "0000000000004b8a8b8a8b8a8b8a8b8a"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "0000000000004b8a8b8a8b8a8b8a8b8b"
preview_id = "0000000000004b8a8b8a8b8a8b8a8b8b"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "0000000000004b8a8b8a8b8a8b8a8c"
preview_id = "0000000000004b8a8b8a8b8a8b8a8c"

[[r2_buckets]]
binding = "ASSETS_R2"
bucket_name = "iprn-assets"

[[queues]]
name = "REWARD_PROCESSING_QUEUE"
binding = "REWARD_PROCESSING_QUEUE"

[[queues]]
name = "WEBHOOK_DELIVERY_QUEUE"
binding = "WEBHOOK_DELIVERY_QUEUE"

[[queues]]
name = "ANALYTICS_QUEUE"
binding = "ANALYTICS_QUEUE"

[[queues]]
name = "EMAIL_QUEUE"
binding = "EMAIL_QUEUE"

[[queues]]
name = "FRAUD_QUEUE"
binding = "FRAUD_QUEUE"

# Queue consumers
[[queues.consumers]]
queue = "WEBHOOK_DELIVERY_QUEUE"
max_batch_size = 100
max_batch_wait = 30
max_retries = 5
dead_letter_queue = "FRAUD_QUEUE"

[[queues.consumers]]
queue = "REWARD_PROCESSING_QUEUE"
max_batch_size = 50
max_batch_wait = 15
max_retries = 3

[[queues.consumers]]
queue = "ANALYTICS_QUEUE"
max_batch_size = 100
max_batch_wait = 30
max_retries = 3

[triggers]
crons = ["*/1 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[env.local]
vars = { VITE_API_URL = "http://localhost:8787" }

[[routes]]
pattern = "iprn.localhost/*"
zone_name = "iprn.localhost"
