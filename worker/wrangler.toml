name = "iprn-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
logpush = true

[vars]
APP_NAME = "IPRN Online"
APP_VERSION = "1.0.0"
# ADMIN_TOKEN is a secret (set via `wrangler secret put`); never commit it.

[[d1_databases]]
binding = "DB"
database_name = "iprn_production"

[[kv_namespaces]]
binding = "CACHE_KV"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"

[[kv_namespaces]]
binding = "SESSION_KV"

# Queue producers (senders exposed on env.<BINDING>)
[[queues.producers]]
queue = "reward-processing-queue"
binding = "REWARD_PROCESSING_QUEUE"

[[queues.producers]]
queue = "webhook-delivery-queue"
binding = "WEBHOOK_DELIVERY_QUEUE"

[[queues.producers]]
queue = "analytics-queue"
binding = "ANALYTICS_QUEUE"

# FRAUD_QUEUE is a dead-letter sink only (referenced by name via dead_letter_queue).
# It is not produced to or consumed by this Worker, so it has no binding here.
# A single Consumer (`queue` handler on src/index.ts) receives batches from the
# three queues below and dispatches on `batch.queue`.

[[queues.consumers]]
queue = "webhook-delivery-queue"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "fraud-queue"

[[queues.consumers]]
queue = "reward-processing-queue"
max_batch_size = 50
max_batch_timeout = 15
max_retries = 3

[[queues.consumers]]
queue = "analytics-queue"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 3

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# Production custom-domain route (add per environment), e.g.:
#   npx wrangler route add "api.example.com/*" iprn-worker
# Do NOT commit a placeholder zone: it makes `wrangler deploy` fail to resolve it.
