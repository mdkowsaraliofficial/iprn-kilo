name = "iprn-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
logpush = true

[vars]
APP_NAME = "IPRN Online"
APP_VERSION = "1.0.0"
# Secrets (e.g. ADMIN_TOKEN) are configured via `wrangler secret put` for
# production and via `worker/.dev.vars` for local dev. Never commit secrets.

[[d1_databases]]
binding = "DB"
database_name = "IPRN_PRODUCTION"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "0000000000004b8a8b8a8b8a8b8a8b8a"
preview_id = "0000000000004b8a8b8a8b8a8b8a8b8a"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "0000000000004b8a8b8a8b8a8b8a8b8b"
preview_id = "0000000000004b8a8b8a8b8a8b8a8b8b"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "0000000000004b8a8b8a8b8a8b8a8c"
preview_id = "0000000000004b8a8b8a8b8a8b8a8c"

[[queues.producers]]
queue = "REWARD_PROCESSING_QUEUE"
binding = "REWARD_PROCESSING_QUEUE"

[[queues.producers]]
queue = "WEBHOOK_DELIVERY_QUEUE"
binding = "WEBHOOK_DELIVERY_QUEUE"

[[queues.producers]]
queue = "ANALYTICS_QUEUE"
binding = "ANALYTICS_QUEUE"

[[queues.producers]]
queue = "FRAUD_QUEUE"
binding = "FRAUD_QUEUE"

# Queue consumers (wrangler v4 schema: queues = { producers, consumers })
[[queues.consumers]]
queue = "WEBHOOK_DELIVERY_QUEUE"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "FRAUD_QUEUE"

[[queues.consumers]]
queue = "REWARD_PROCESSING_QUEUE"
max_batch_size = 50
max_batch_timeout = 15
max_retries = 3

[[queues.consumers]]
queue = "ANALYTICS_QUEUE"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 3

[triggers]
crons = ["*/1 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# Add a production custom-domain route per environment, e.g.:
#   npx wrangler route add "api.example.com/*" iprn-worker
# Do NOT commit a placeholder zone: it makes `wrangler deploy` fail to resolve it.
